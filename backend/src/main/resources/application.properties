spring.application.name=erplocal

# Postgres local via docker-compose (raiz do projeto)
spring.datasource.url=jdbc:postgresql://localhost:5433/erplocal
spring.datasource.username=erplocal
spring.datasource.password=erplocal
spring.datasource.driver-class-name=org.postgresql.Driver

# Cria/atualiza tabelas a partir das @Entity (suficiente p/ US1; evoluir p/ Flyway depois)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
# Admin inicial via seed (email configuravel por env, senha sempre hasheada, nunca em plain)
app.admin.email=${ERP_ADMIN_EMAIL:admin@local}
app.admin.password=${ERP_ADMIN_PASSWORD:changeme}

# JWT (troque JWT_SECRET por env em qualquer ambiente real)
app.jwt.secret=${JWT_SECRET:dev-secret-change-me}
app.jwt.issuer=erplocal
app.jwt.expiration-hours=12

# Google OAuth (mesmo client_id do .env do front; backend valida a audience do idToken.
# Pode listar mais de um client_id separado por virgula: Web (GIS no dev) + Desktop (PKCE no Tauri prod).
# O client_secret NUNCA vai para o front — só o backend usa na troca do code (fluxo Tauri).
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
