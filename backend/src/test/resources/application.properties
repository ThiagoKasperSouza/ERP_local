spring.application.name=erplocal-test

# Testes continuam com H2 em memoria (nao precisam do Postgres)
spring.datasource.url=jdbc:h2:mem:erplocal-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Segredo fake so para exercitar o endpoint de troca de code (Google real rejeita)
app.google.client-secret=test-secret
