services:
  postgres:
    image: postgres:16-alpine
    container_name: erplocal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erplocal
      POSTGRES_USER: erplocal
      POSTGRES_PASSWORD: erplocal
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
