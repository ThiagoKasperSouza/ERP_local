<main class="auth-page">
  <div class="auth-card">
    <h1>Entrar</h1>
    <form id="login-form" novalidate>
      <div class="mb-3">
        <label class="form-label" for="login-email">E-mail</label>
        <input class="form-control" id="login-email" type="email" autocomplete="username" />
        <div class="invalid-feedback"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="login-password">Senha</label>
        <input class="form-control" id="login-password" type="password" autocomplete="current-password" />
        <div class="invalid-feedback"></div>
      </div>
      <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
    <div class="auth-divider"><span>ou</span></div>
    <div id="google-button" class="d-flex justify-content-center"></div>
    <p class="mt-3 mb-0 text-center">
      Sem conta? <a href="/register">Cadastre-se</a>
    </p>
  </div>
</main>
