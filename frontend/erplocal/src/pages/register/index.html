<main class="auth-page">
  <div class="auth-card">
    <h1>Criar conta</h1>
    <form id="register-form" novalidate>
      <div class="mb-3">
        <label class="form-label" for="register-name">Nome</label>
        <input class="form-control" id="register-name" autocomplete="name" />
        <div class="invalid-feedback"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="register-email">E-mail</label>
        <input class="form-control" id="register-email" type="email" autocomplete="username" />
        <div class="invalid-feedback"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="register-password">Senha (mín. 6)</label>
        <input class="form-control" id="register-password" type="password" autocomplete="new-password" />
        <div class="invalid-feedback"></div>
      </div>
      <div id="register-error" class="alert alert-danger d-none" role="alert"></div>
      <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
    </form>
    <p class="mt-3 mb-0 text-center">
      Já tem conta? <a href="/login">Entrar</a>
    </p>
  </div>
</main>
